# Cloudflare Worker config for the WeSC marketing/docs site.
#
# A plain JavaScript/TypeScript Worker. The `[build]` command renders the site
# with the `wesc` npm package on the host (see scripts/build-site.ts) and writes
# dist/generated.js, which Wrangler inlines into the Worker bundle at `main`.
name = "wesc-site"
main = "src/index.ts"
compatibility_date = "2025-04-23"

[build]
command = "node --disable-warning=ExperimentalWarning scripts/build-site.ts"
# Rerender when any component/page source changes during `wrangler dev`.
watch_dir = "web"
