# Cloudflare Worker config for the WeSC marketing/docs site.
#
# `worker-build` compiles the Rust crate to wasm32-unknown-unknown and emits the
# JS shim that Wrangler deploys; `main` points at that generated entrypoint.
name = "wesc-site"
main = "build/worker/shim.mjs"
compatibility_date = "2025-04-23"

[build]
command = "cargo install -q worker-build && worker-build --release"
# Wrangler defaults custom-build watching to ./src. The site source lives mostly
# under web/, and build.rs tells Cargo to regenerate wesc output when web/ changes,
# so watch both trees for dev reloads.
watch_dir = ["src", "web"]
