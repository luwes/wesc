<script type="module">
  // Light-DOM shell element. Marks the nav link matching the current path with
  // `aria-current` (used for both styling and assistive tech) on upgrade.
  class WSiteHeader extends HTMLElement {
    connectedCallback() {
      const here = location.pathname.replace(/\/+$/, '') || '/';
      for (const link of this.querySelectorAll('.site-nav a')) {
        const href = (link.getAttribute('href') ?? '').replace(/\/+$/, '') || '/';
        if (href === here) link.setAttribute('aria-current', 'page');
      }
    }
  }
  customElements.define('w-site-header', WSiteHeader);
</script>
