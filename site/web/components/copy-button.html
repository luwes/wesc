<template shadowrootmode="open">
  <style>
    :host {
      display: inline-flex;
      align-items: stretch;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .cmd {
      padding: 0.55rem 0.9rem;
      background: var(--code-bg);
      white-space: nowrap;
    }
    .cmd::before {
      content: '$ ';
      color: var(--muted);
    }
    button {
      appearance: none;
      border: 0;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      font: inherit;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
    button:hover {
      background: rgb(52 211 153 / 12%);
    }
  </style>
  <span class="cmd"><slot>npm i wesc</slot></span>
  <button type="button" part="button">Copy</button>
</template>

<style>
  w-copy-button {
    display: inline-flex;
  }
</style>

<script type="module">
  class WCopyButton extends HTMLElement {
    connectedCallback() {
      const button = this.shadowRoot?.querySelector('button');
      const cmd = this.shadowRoot?.querySelector('.cmd');
      if (!button || !cmd) return;

      button.addEventListener('click', async () => {
        const text = (this.getAttribute('text') ?? cmd.textContent ?? '').trim();
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = 'Copied!';
        } catch {
          button.textContent = 'Press ⌘C';
        }
        setTimeout(() => {
          button.textContent = 'Copy';
        }, 1500);
      });
    }
  }
  customElements.define('w-copy-button', WCopyButton);
</script>
