[package]
name = "rust-server"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "rust-server"
path = "src/main.rs"

# Unlike the other server examples, which call wesc through a language binding,
# the Rust example depends on the core crate directly.
[dependencies]
wesc = { path = "../../crates/wesc" }
