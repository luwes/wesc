[package]
name = "wesc-py"
version = "0.7.0"
authors = ["Wesley Luyten <me@wesleyluyten.com>"]
edition = "2021"
license = "MIT"
description = "Python bindings for the wesc web component bundler"
repository = "https://github.com/luwes/wesc"
publish = false

[lib]
# Importable as `wesc._wesc`; the pure-Python `wesc` package re-exports from it.
name = "_wesc"
crate-type = ["cdylib"]

[dependencies]
# `abi3-py38` builds a single wheel that works on CPython 3.8+. The
# `extension-module` feature is enabled by maturin (see pyproject.toml) so plain
# `cargo check`/`cargo test` still link against libpython locally.
pyo3 = { version = "0.29", features = ["abi3-py38"] }
wesc = { path = "../wesc" }
