<link rel="definition" name="todo-item" href="./todo-item.html">

<template>
  <ul class="todo-list" aria-label="Todo list">
    <slot></slot>
  </ul>
  <template id="todo-item-template"><todo-item></todo-item></template>
</template>

<style>
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
</style>

<script type="module">
  class TodoList extends HTMLElement {
    get items() {
      return [...this.querySelectorAll('todo-item')];
    }

    addItem(title) {
      // Clone the build-rendered template item (single source of truth is
      // todo-item.html). Works even when the list starts empty.
      const template = document.getElementById('todo-item-template');
      const item = template.content.firstElementChild.cloneNode(true);

      const label = item.querySelector('label');
      if (label) label.textContent = title;

      const edit = item.querySelector('.edit');
      if (edit) edit.value = title;

      this.querySelector('.todo-list')?.append(item);
    }
  }

  customElements.define('todo-list', TodoList);
</script>
