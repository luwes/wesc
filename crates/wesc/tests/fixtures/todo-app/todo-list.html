<link rel="definition" name="todo-item" href="./todo-item.html">

<template>
  <ul class="todo-list" aria-label="Todo list">
    <todo-item status="completed">Learn WeSC</todo-item>
    <todo-item>Build the famous todo app</todo-item>
    <todo-item>Ship tiny web components</todo-item>
  </ul>
</template>

<style>
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
</style>

<script type="module">
  class TodoList extends HTMLElement {
    get items() {
      return [...this.querySelectorAll('todo-item')];
    }

    addItem(title) {
      const item = document.createElement('todo-item');
      const li = document.createElement('li');
      const view = document.createElement('div');
      const toggle = document.createElement('input');
      const label = document.createElement('label');
      const destroy = document.createElement('button');
      const edit = document.createElement('input');

      view.className = 'view';
      toggle.className = 'toggle';
      toggle.type = 'checkbox';
      label.textContent = title;
      destroy.className = 'destroy';
      destroy.type = 'button';
      destroy.setAttribute('aria-label', 'Remove todo');
      edit.className = 'edit';
      edit.value = title;

      view.append(toggle, label, destroy);
      li.append(view, edit);
      item.append(li);
      this.querySelector('.todo-list')?.append(item);
    }
  }

  customElements.define('todo-list', TodoList);
</script>
