<link rel="definition" name="todo-header" href="./todo-header.html">
<link rel="definition" name="todo-form" href="./todo-form.html">
<link rel="definition" name="todo-list" href="./todo-list.html">
<link rel="definition" name="todo-item" href="./todo-item.html">
<link rel="definition" name="todo-footer" href="./todo-footer.html">

<template>
  <section class="todoapp">
    <todo-header></todo-header>
    <todo-form></todo-form>
    <section class="main">
      <input id="toggle-all" class="toggle-all" type="checkbox">
      <label for="toggle-all">Mark all as complete</label>
      <todo-list></todo-list>
    </section>
    <todo-footer></todo-footer>
  </section>
  <footer class="info">
    <p>Double-click to edit a todo</p>
    <p>Created by the TodoMVC Team</p>
    <p>Part of TodoMVC</p>
  </footer>
</template>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    background: #f5f5f5;
    color: #4d4d4d;
    font: 14px "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    line-height: 1.4em;
    min-width: 230px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    background: none;
    border: 0;
    color: inherit;
    margin: 0;
    padding: 0;
  }

  todo-app {
    display: block;
  }

  .todoapp {
    background: white;
    box-shadow:
      0 2px 4px 0 rgb(0 0 0 / 20%),
      0 25px 50px 0 rgb(0 0 0 / 10%);
    margin: 130px auto 40px;
    position: relative;
    width: 550px;
  }

  .main {
    border-top: 1px solid #e6e6e6;
    position: relative;
    z-index: 2;
  }

  .toggle-all {
    border: none;
    bottom: 100%;
    height: 1px;
    opacity: 0;
    position: absolute;
    right: 100%;
    width: 1px;
  }

  .toggle-all + label {
    align-items: center;
    display: flex;
    font-size: 0;
    height: 34px;
    justify-content: center;
    left: -13px;
    position: absolute;
    top: -52px;
    transform: rotate(90deg);
    width: 60px;
  }

  .toggle-all + label::before {
    color: #e6e6e6;
    content: "❯";
    font-size: 22px;
    padding: 10px 27px;
  }

  .toggle-all:checked + label::before {
    color: #737373;
  }

  .info {
    color: #bfbfbf;
    font-size: 10px;
    margin: 65px auto 0;
    text-align: center;
    text-shadow: 0 1px 0 rgb(255 255 255 / 50%);
  }

  .info p {
    line-height: 1;
  }
</style>

<script type="module">
  import './todo-header.js';
  import './todo-form.js';
  import './todo-list.js';
  import './todo-item.js';
  import './todo-footer.js';

  class TodoApp extends HTMLElement {
    connectedCallback() {
      this.dataset.enhanced = 'true';

      this.addEventListener('todo-add', (event) => {
        this.querySelector('todo-list')?.addItem(event.detail.title);
        this.updateCount();
      });

      this.addEventListener('todo-remove', (event) => {
        event.target.closest('todo-item')?.remove();
        this.updateCount();
      });

      this.addEventListener('todo-toggle', () => {
        this.updateCount();
      });

      this.querySelector('.toggle-all')?.addEventListener('change', (event) => {
        this.querySelectorAll('todo-item').forEach((item) => {
          item.completed = event.target.checked;
        });
        this.updateCount();
      });

      this.querySelector('todo-footer')?.addEventListener('todo-clear-completed', () => {
        this.querySelectorAll('todo-item[status="completed"]').forEach((item) => {
          item.remove();
        });
        this.updateCount();
      });

      window.addEventListener('hashchange', () => this.applyFilter());
      this.updateCount();
      this.applyFilter();
    }

    updateCount() {
      const items = [...this.querySelectorAll('todo-item')];
      const remaining = items.filter((item) => item.getAttribute('status') !== 'completed').length;

      this.querySelector('todo-footer')?.setAttribute('count', String(remaining));
      this.querySelector('.toggle-all').checked = items.length > 0 && remaining === 0;
      this.applyFilter();
    }

    applyFilter() {
      const filter = location.hash.replace('#/', '') || 'all';

      this.querySelectorAll('todo-item').forEach((item) => {
        const completed = item.getAttribute('status') === 'completed';
        item.hidden =
          (filter === 'active' && completed) ||
          (filter === 'completed' && !completed);
      });

      this.querySelector('todo-footer')?.selectFilter(filter);
    }
  }

  customElements.define('todo-app', TodoApp);
</script>
