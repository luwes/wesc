<!doctype html>
<html lang="en">
  <head>
    <title>TodoMVC: WeSC</title>
    
  </head>
  <body>
    <todo-app>
      <section class="todoapp">
        <todo-header>
          <header class="header">
            <h1>Todos</h1>
          </header>
        </todo-header>
        <todo-form>
          <form class="new-todo-form">
            <input
              class="new-todo"
              name="title"
              placeholder="What needs to be done?"
              autocomplete="off"
            />
          </form>
        </todo-form>
        <section class="main">
          <input id="toggle-all" class="toggle-all" type="checkbox" />
          <label for="toggle-all">Mark all as complete</label>
          <todo-list>
            <ul class="todo-list" aria-label="Todo list">
              <todo-item status="completed">
                <li>
                  <div class="view">
                    <input class="toggle" type="checkbox" />
                    <label>Learn WeSC</label>
                    <button class="destroy" type="button" aria-label="Remove todo"></button>
                  </div>
                  <input class="edit" />
                </li>
              </todo-item>
              <todo-item>
                <li>
                  <div class="view">
                    <input class="toggle" type="checkbox" />
                    <label>Build the famous todo app</label>
                    <button class="destroy" type="button" aria-label="Remove todo"></button>
                  </div>
                  <input class="edit" />
                </li>
              </todo-item>
              <todo-item>
                <li>
                  <div class="view">
                    <input class="toggle" type="checkbox" />
                    <label>Ship tiny web components</label>
                    <button class="destroy" type="button" aria-label="Remove todo"></button>
                  </div>
                  <input class="edit" />
                </li>
              </todo-item>
            </ul>
            <template id="todo-item-template"
              ><todo-item>
                <li>
                  <div class="view">
                    <input class="toggle" type="checkbox" />
                    <label></label>
                    <button class="destroy" type="button" aria-label="Remove todo"></button>
                  </div>
                  <input class="edit" />
                </li> </todo-item
            ></template>
          </todo-list>
        </section>
        <todo-footer>
          <footer class="footer">
            <span class="todo-count"><strong>2</strong> items left</span>
            <ul class="filters">
              <li><a class="selected" href="#/">All</a></li>
              <li><a href="#/active">Active</a></li>
              <li><a href="#/completed">Completed</a></li>
            </ul>
            <button class="clear-completed" type="button">Clear completed</button>
          </footer>
        </todo-footer>
      </section>
      <footer class="info">
        <p>Double-click to edit a todo</p>
        <p>Created by the TodoMVC Team</p>
        <p>Part of TodoMVC</p>
      </footer>
    </todo-app>
  </body>
</html>
