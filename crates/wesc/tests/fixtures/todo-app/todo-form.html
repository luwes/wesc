<template>
  <form class="new-todo-form">
    <input class="new-todo" name="title" placeholder="What needs to be done?" autocomplete="off">
  </form>
</template>

<style>
  .new-todo {
    border: none;
    box-sizing: border-box;
    color: inherit;
    font-size: 24px;
    font-weight: inherit;
    line-height: 1.4em;
    margin: 0;
    padding: 16px 16px 16px 60px;
    position: relative;
    width: 100%;
  }

  .new-todo::placeholder {
    color: #e6e6e6;
    font-style: italic;
    font-weight: 300;
  }

  .new-todo:focus {
    box-shadow: inset 0 -2px 1px rgb(0 0 0 / 3%);
    outline: 0;
  }
</style>

<script type="module">
  class TodoForm extends HTMLElement {
    connectedCallback() {
      this.querySelector('form')?.addEventListener('submit', (event) => {
        event.preventDefault();
        const input = event.currentTarget.elements.title;
        const title = input.value.trim();

        if (!title) {
          return;
        }

        this.dispatchEvent(new CustomEvent('todo-add', {
          bubbles: true,
          composed: true,
          detail: { title },
        }));

        input.value = '';
      });
    }
  }

  customElements.define('todo-form', TodoForm);
</script>
