<template>
  <li>
    <div class="view">
      <input class="toggle" type="checkbox">
      <label><slot></slot></label>
      <button class="destroy" type="button" aria-label="Remove todo"></button>
    </div>
    <input class="edit">
  </li>
</template>

<style>
  todo-item {
    display: block;
  }

  todo-item[hidden] {
    display: none;
  }

  todo-item[editing] .view {
    display: none;
  }

  todo-item li {
    border-bottom: 1px solid #ededed;
    font-size: 24px;
    position: relative;
  }

  todo-item li:last-child {
    border-bottom: none;
  }

  todo-item .toggle {
    appearance: none;
    border: none;
    bottom: 0;
    height: 40px;
    margin: auto 0;
    opacity: 0;
    position: absolute;
    text-align: center;
    top: 0;
    width: 40px;
  }

  todo-item .toggle + label {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='-10 -18 100 135'><circle cx='50' cy='50' r='50' fill='none' stroke='%23ededed' stroke-width='3'/></svg>");
    background-position: center left;
    background-repeat: no-repeat;
    display: block;
    line-height: 1.2;
    padding: 15px 15px 15px 60px;
    transition: color 0.4s;
    word-break: break-all;
  }

  todo-item[status="completed"] .toggle + label,
  todo-item .toggle:checked + label {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='-10 -18 100 135'><circle cx='50' cy='50' r='50' fill='none' stroke='%23bddad5' stroke-width='3'/><path fill='%235dc2af' d='M72 25 42 71 27 52l-5 6 20 25 36-54z'/></svg>");
    color: #d9d9d9;
    text-decoration: line-through;
  }

  todo-item .destroy {
    bottom: 0;
    color: #cc9a9a;
    display: none;
    font-size: 30px;
    height: 40px;
    margin: auto 0;
    position: absolute;
    right: 10px;
    top: 0;
    transition: color 0.2s ease-out;
    width: 40px;
  }

  todo-item .destroy::after {
    content: "x";
  }

  todo-item li:hover .destroy {
    display: block;
  }

  todo-item .destroy:hover {
    color: #af5b5e;
  }

  todo-item .edit {
    display: none;
  }

  todo-item[editing] .edit {
    border: 1px solid #999;
    box-shadow: inset 0 -1px 5px 0 rgb(0 0 0 / 20%);
    box-sizing: border-box;
    color: inherit;
    display: block;
    font-size: 24px;
    line-height: 1.4em;
    margin: 0 0 0 43px;
    padding: 12px 16px;
    width: calc(100% - 43px);
  }
</style>

<script type="module">
  class TodoItem extends HTMLElement {
    connectedCallback() {
      if (this.getAttribute('status') === 'completed') {
        this.completed = true;
      }

      this.querySelector('.toggle')?.addEventListener('change', (event) => {
        this.completed = event.target.checked;
        this.dispatchEvent(new CustomEvent('todo-toggle', { bubbles: true }));
      });

      this.querySelector('.destroy')?.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('todo-remove', { bubbles: true }));
      });

      this.querySelector('label')?.addEventListener('dblclick', () => {
        this.startEditing();
      });

      this.querySelector('.edit')?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          this.commitEdit();
        }

        if (event.key === 'Escape') {
          this.cancelEdit();
        }
      });

      this.querySelector('.edit')?.addEventListener('blur', () => {
        if (this.hasAttribute('editing')) {
          this.commitEdit();
        }
      });
    }

    get completed() {
      return this.getAttribute('status') === 'completed';
    }

    set completed(value) {
      this.toggleAttribute('data-completed', value);
      this.querySelector('.toggle').checked = value;

      if (value) {
        this.setAttribute('status', 'completed');
      } else {
        this.removeAttribute('status');
      }
    }

    startEditing() {
      const edit = this.querySelector('.edit');

      edit.value = this.querySelector('label').textContent;
      this.dataset.previousTitle = edit.value;
      this.setAttribute('editing', '');
      edit.focus();
      edit.setSelectionRange(edit.value.length, edit.value.length);
    }

    commitEdit() {
      const edit = this.querySelector('.edit');
      const title = edit.value.trim();

      if (!title) {
        this.dispatchEvent(new CustomEvent('todo-remove', { bubbles: true }));
        return;
      }

      this.querySelector('label').textContent = title;
      this.removeAttribute('editing');
      delete this.dataset.previousTitle;
    }

    cancelEdit() {
      const edit = this.querySelector('.edit');

      edit.value = this.dataset.previousTitle ?? this.querySelector('label').textContent;
      this.removeAttribute('editing');
      delete this.dataset.previousTitle;
    }
  }

  customElements.define('todo-item', TodoItem);
</script>
