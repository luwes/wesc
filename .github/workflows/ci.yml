name: CI

on: [push, pull_request]

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run lint

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm test

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g oxfmt # oxfmt is used to normalize output in the Rust tests
      - uses: dtolnay/rust-toolchain@stable
      # Cache compiled dependencies (rolldown, lol_html, tokio, …) so only
      # changed code recompiles. Only `main` writes the cache; branches/PRs
      # restore it (keeps the repo under GitHub's 10 GB cache budget).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test

  build-rust:
    runs-on: ubuntu-latest
    # This job only checks that the workspace compiles in release mode — it
    # doesn't ship or benchmark anything — so disable LTO (and split into more
    # codegen units for parallelism) to cut the slow link-time optimization.
    # Shipped artifacts (cd.yml) and the perf budgets (perf-rust) keep full LTO.
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The PHP extension crate (wesc-php) needs PHP dev headers (php-config) and
      # libclang to compile, so install them to lint the whole workspace.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  perf-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Enforce the bundler performance budgets (see crates/wesc/tests/perf_guard.rs).
      # Release build so timings reflect optimized performance; the scale gives
      # headroom for shared CI runners.
      - run: cargo test -p wesc --release --test perf_guard -- --nocapture
        env:
          WESC_PERF_SCALE: '2'
