name: CI

on: [push, pull_request]

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run lint

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm test

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g oxfmt # oxfmt is used to normalize output in the Rust tests
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release

  perf-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Enforce the bundler performance budgets (see crates/wesc/tests/perf_guard.rs).
      # Release build so timings reflect optimized performance; the scale gives
      # headroom for shared CI runners.
      - run: cargo test -p wesc --release --test perf_guard -- --nocapture
        env:
          WESC_PERF_SCALE: '2'
