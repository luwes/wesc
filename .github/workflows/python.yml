name: Python

# Build the `wesc` Python wheels + sdist with maturin and upload them as
# workflow artifacts, to smoke-test the build matrix on a PR or push. Publishing
# to PyPI happens on a release in .github/workflows/cd.yml (release-please), so
# every package/crate ships at the same version — this workflow never publishes.

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/wesc-py/**'
      - 'crates/wesc/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'crates/wesc-py/**'
      - 'crates/wesc/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

defaults:
  run:
    # maturin reads the pyproject.toml / Cargo.toml from the crate directory.
    working-directory: crates/wesc-py

jobs:
  # One abi3 wheel per platform/arch — covers CPython 3.8+ thanks to abi3-py38.
  wheels:
    name: wheels - ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The repo pins nightly via rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `--manifest-path` is implied by the working-directory above.
          args: --release --out dist
          working-directory: crates/wesc-py
          # manylinux build container for portable Linux wheels.
          manylinux: ${{ contains(matrix.platform.target, 'linux') && 'auto' || '' }}
          # Cache compilation across runs; works inside the manylinux container
          # (where Swatinem/rust-cache on the runner wouldn't reach).
          sccache: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: crates/wesc-py/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/wesc-py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/wesc-py/dist
