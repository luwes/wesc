name: Python

# Build (and optionally publish) the `wesc` Python wheels with maturin.
#
# - On a manual run with `publish = true`, the built wheels + sdist are uploaded
#   to PyPI via Trusted Publishing (OIDC) — no API token needed.
# - Otherwise it just builds the wheels and uploads them as workflow artifacts,
#   which is handy to smoke-test the matrix on a PR or push.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish wheels to PyPI'
        type: boolean
        default: false
  push:
    paths:
      - 'crates/wesc-py/**'
      - 'crates/wesc/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'crates/wesc-py/**'
      - 'crates/wesc/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

defaults:
  run:
    # maturin reads the pyproject.toml / Cargo.toml from the crate directory.
    working-directory: crates/wesc-py

jobs:
  # One abi3 wheel per platform/arch — covers CPython 3.8+ thanks to abi3-py38.
  wheels:
    name: wheels - ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The repo pins nightly via rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `--manifest-path` is implied by the working-directory above.
          args: --release --out dist
          working-directory: crates/wesc-py
          # manylinux build container for portable Linux wheels.
          manylinux: ${{ contains(matrix.platform.target, 'linux') && 'auto' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: crates/wesc-py/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/wesc-py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/wesc-py/dist

  publish:
    name: publish to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    environment: production
    permissions:
      # Trusted Publishing (OIDC) — no token stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The PyPA action performs the PyPI OIDC token exchange automatically when
      # `id-token: write` is set and a trusted publisher is configured.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
