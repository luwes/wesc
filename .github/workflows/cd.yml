name: CD

concurrency: production

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        description: Version
        options:
        - conventional
        - patch
        - minor
        - major
        - prerelease
        - from-package
        - from-git
      prerelease:
        type: choice
        description: Pre-release
        options:
        -
        - canary
        - beta
      dryrun:
        description: 'Dry-run'
        type: boolean

run-name: Deploy ${{ inputs.version }} ${{ inputs.dryrun && '--dry-run' || '' }} ${{ inputs.prerelease && format('--prerelease {0}', inputs.prerelease) || '' }}

permissions:
  contents: write
  id-token: write

jobs:
  # Build the native addon once per platform and upload each `*.node` binary.
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Build both macOS targets on arm64 runners; x86_64 cross-compiles via
          # Apple's toolchain (macos-13 Intel runners are retired).
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          # Build arm64 Linux natively on a GitHub arm64 runner (no cross-compile).
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # --- Native runners (macOS, Windows): install Rust + target, build directly.
      # The repo pins nightly via rust-toolchain.toml, so install the build
      # target onto nightly (cross targets like x86_64 on arm64 need it there).
      - name: Install Rust
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: npm ci
      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: npm run build:native -- --target ${{ matrix.settings.target }}
        shell: bash

      # --- Linux runners: build inside the napi-rs toolchain image (rust + zig + node).
      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}:/build -w /build'
          run: npm ci && npm run build:native -- --target ${{ matrix.settings.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error

  # Publish the platform packages + the main `wesc` package.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      # Token with rights to create new packages — needed to bootstrap the
      # wesc-<triple> packages on first publish (OIDC trusted publishing can't
      # create packages that don't exist yet). Once they exist, this can be
      # dropped in favour of trusted publishing. Provenance still works via the
      # job's id-token permission + --provenance.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # wet-run's --github-release uses conventional-github-releaser, which reads this
      CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # passed through to `napi prepublish` inside prepublishOnly so a dry-run
      # never actually publishes the platform packages
      NAPI_PREPUBLISH_FLAGS: ${{ inputs.dryrun && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for tags + conventional changelog
      # Node 24 (latest stable) ships npm 11, required for Trusted Publishing
      # (OIDC); npm generates provenance automatically when publishing via OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: fregante/setup-git-user@v1
      - run: npm ci
      - run: npm test

      # Collect every platform binary into npm/<triple>/ for prepublish.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npx napi create-npm-dir -t .
      - run: npx napi artifacts --dir artifacts --dist npm
      - run: ls -R npm

      # wet-run bumps the version, writes the changelog, tags, pushes, and runs
      # `npm publish` — which triggers prepublishOnly -> `napi prepublish`,
      # publishing each wesc-<triple> package and wiring optionalDependencies.
      - name: Release
        run: >-
          npx --yes wet-run@1.0.3 release ${{ inputs.version }}
          ${{ inputs.dryrun && '--dry-run' || '' }}
          ${{ inputs.prerelease && format('--prerelease {0}', inputs.prerelease) || '' }}
          --provenance --changelog --github-release --verbose
