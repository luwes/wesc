name: CD

concurrency: production

on:
  push:
    branches:
      - main
  # Allows you to re-run release-please manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # On every push to main, release-please maintains a "release PR" that bumps
  # versions and changelogs from conventional commits. Merging that PR tags the
  # release(s) and flips the `*_release` outputs to 'true', which gates the
  # publish jobs below. Tags are namespaced per package (wesc-v*, dom-v*).
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      # Every package/crate shares one linked version (see
      # .github/release-please/config.json), so a release bumps them together.
      # Each `*_release` flag gates the matching publish job below.
      wesc_release: ${{ steps.release.outputs['packages/wesc--release_created'] }}
      dom_release: ${{ steps.release.outputs['packages/dom--release_created'] }}
      py_release: ${{ steps.release.outputs['crates/wesc-py--release_created'] }}
      gem_release: ${{ steps.release.outputs['crates/wesc-rb--release_created'] }}
      crate_release: ${{ steps.release.outputs['crates/wesc--release_created'] }}
      version: ${{ steps.release.outputs['packages/wesc--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Build the native addon once per platform — only when a `wesc` release is cut.
  build:
    name: build - ${{ matrix.settings.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.wesc_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Build both macOS targets on arm64 runners; x86_64 cross-compiles via
          # Apple's toolchain (macos-13 Intel runners are retired).
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          # Build arm64 Linux natively on a GitHub arm64 runner (no cross-compile).
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # --- Native runners (macOS, Windows): install Rust + target, build directly.
      # The repo pins nightly via rust-toolchain.toml, so install the build
      # target onto nightly (cross targets like x86_64 on arm64 need it there).
      - name: Install Rust
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: npm ci
      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: npm run build:native --workspace=wesc -- --target ${{ matrix.settings.target }}
        shell: bash

      # --- Linux runners: build inside the napi-rs toolchain image (rust + zig + node).
      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}:/build -w /build'
          run: npm ci && npm run build:native --workspace=wesc -- --target ${{ matrix.settings.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: 'packages/wesc/*.node'
          if-no-files-found: error

  # Publish the platform packages + the main `wesc` package to npm.
  #
  # Auth is OIDC Trusted Publishing (no stored token): npm authenticates via the
  # job's id-token when a trusted publisher is configured on npmjs.com. Each
  # published package needs its own trusted publisher — the main `wesc` package
  # AND every @wesc/binding-<triple> package. npm OIDC can't create a package
  # that doesn't exist yet, so adding a NEW platform triple needs a one-time
  # manual publish (or token) to bootstrap that package before OIDC takes over.
  publish-wesc:
    name: publish wesc
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.wesc_release == 'true' }}
    environment: production
    permissions:
      # OIDC token for npm Trusted Publishing (also drives automatic provenance).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1; pin to latest so it's guaranteed.
      - run: npm install -g npm@latest
      - run: npm ci

      # Collect every platform binary into npm/<triple>/ for prepublish.
      # The napi commands read the `napi` config from packages/wesc/package.json,
      # so they run from there.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/wesc/artifacts
      - run: npx napi create-npm-dir -t .
        working-directory: packages/wesc
      - run: npx napi artifacts --dir artifacts --dist npm
        working-directory: packages/wesc
      - run: ls -R npm
        working-directory: packages/wesc

      # `npm publish` triggers prepublishOnly -> `napi prepublish`, which
      # publishes each @wesc/binding-<triple> package and wires up the main
      # package's optionalDependencies, then publishes `wesc` with provenance.
      - name: Publish
        working-directory: packages/wesc
        run: npm publish --provenance --access public

  # Publish the pure-JS `@wesc/dom` package to npm (OIDC Trusted Publishing).
  publish-dom:
    name: publish @wesc/dom
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.dom_release == 'true' }}
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1; pin to latest so it's guaranteed.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test --workspace=@wesc/dom

      # prepublishOnly bundles src/ -> dist/ with esbuild before the tarball is
      # created.
      - name: Publish
        run: npm publish --workspace=@wesc/dom --provenance --access public

  # ---------------------------------------------------------------------------
  # Python: build abi3 wheels + sdist with maturin and publish to PyPI via
  # Trusted Publishing (OIDC). Mirrors the matrix in .github/workflows/python.yml
  # (which can still build/publish manually); this runs only on a release.
  # ---------------------------------------------------------------------------
  python-wheels:
    name: python wheels - ${{ matrix.platform.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.py_release == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: crates/wesc-py
          manylinux: ${{ contains(matrix.platform.target, 'linux') && 'auto' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: crates/wesc-py/dist

  python-sdist:
    name: python sdist
    needs: release-please
    if: ${{ needs.release-please.outputs.py_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/wesc-py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/wesc-py/dist

  publish-python:
    name: publish to PyPI
    needs: [release-please, python-wheels, python-sdist]
    if: ${{ needs.release-please.outputs.py_release == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Trusted Publishing (OIDC) — no token stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The PyPA action performs the PyPI OIDC token exchange automatically when
      # `id-token: write` is set and a trusted publisher is configured; it uploads
      # everything in ./dist (the maturin wheels + sdist).
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Ruby: build precompiled native gems (per platform, via rb-sys-dock) plus a
  # source gem, then push them to RubyGems. Auth is OIDC Trusted Publishing (no
  # stored key) — configure a trusted publisher for the `wesc` gem on
  # rubygems.org pointing at this workflow (a pending publisher works for the
  # first, not-yet-existing release).
  # ---------------------------------------------------------------------------
  publish-gem:
    name: publish gem - ${{ matrix.platform }}
    # The gem's Rust ext depends on the `wesc` core crate by version, so the
    # core must be on crates.io first (publish-crate). Cross-built gems fetch it
    # there when built outside the workspace.
    needs: [release-please, publish-crate]
    if: ${{ needs.release-please.outputs.gem_release == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # OIDC token for RubyGems Trusted Publishing.
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
      # Cross-compile a precompiled gem for the target platform in an
      # rb-sys-dock container (covers Ruby 3.0–3.3 in one fat gem).
      - name: Build native gem
        uses: oxidize-rb/cross-gem-action@v9
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.0,3.1,3.2,3.3'
          working-directory: crates/wesc-rb
      # Exchange the workflow's OIDC token for short-lived RubyGems credentials.
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push native gem
        working-directory: crates/wesc-rb
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem"
          done

  # Push a plain source gem once (it builds the Rust extension on `gem install`
  # for platforms without a precompiled build).
  publish-gem-source:
    name: publish gem - source
    needs: [release-please, publish-crate]
    if: ${{ needs.release-please.outputs.gem_release == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Build and push source gem
        working-directory: crates/wesc-rb
        run: |
          gem build wesc.gemspec -o pkg/wesc.gem
          gem push pkg/wesc.gem

  # ---------------------------------------------------------------------------
  # Rust: publish the bundler core crate to crates.io. The binding crates are
  # `publish = false`, so only `wesc` is pushed. Auth is OIDC Trusted Publishing
  # (no stored token) — configure a trusted publisher for the `wesc` crate on
  # crates.io pointing at this workflow.
  # ---------------------------------------------------------------------------
  publish-crate:
    name: publish wesc crate
    needs: release-please
    if: ${{ needs.release-please.outputs.crate_release == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # OIDC token for crates.io Trusted Publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Exchange the workflow's OIDC token for a short-lived crates.io token.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p wesc
