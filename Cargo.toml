[workspace]
resolver = "2"

members = ["crates/wesc", "crates/wesc-node", "crates/wesc-py", "crates/wesc-php", "crates/wesc-go", "crates/wesc-rb/ext/wesc"]

# `wesc-php` and `wesc-rb` are excluded from the default set so a bare
# `cargo build` / `cargo test` at the root doesn't try to compile them: the PHP
# extension needs PHP dev headers (php-config) and libclang, and the Ruby
# extension needs Ruby dev headers and libclang. Build the PHP extension with
# `cargo build -p wesc-php`; the Ruby extension is a loadable extension that
# links against the host Ruby at load time, so build it with `rake compile` in
# `crates/wesc-rb` (a plain `cargo build -p wesc-rb` won't link standalone, but
# `cargo check -p wesc-rb` typechecks it). The dedicated `.github/workflows/
# php.yml` and `.github/workflows/ruby.yml` install those deps; the other crates
# build with the toolchains CI already provides.
default-members = ["crates/wesc", "crates/wesc-node", "crates/wesc-py", "crates/wesc-go"]

# Optimize the native Node addon for size/speed when built with --release.
#
# `lto = "thin"` instead of fat `lto = true`: ThinLTO links the rolldown-heavy
# dependency graph dramatically faster (≈16s vs ≈90s to relink the Node addon
# after a one-line change) while keeping runtime within a hair of fat LTO. The
# perf_guard release test still passes with generous headroom. If a publish
# build ever needs the last fraction of a percent, build it with
# `--config 'profile.release.lto=true'`.
[profile.release]
lto = "thin"
strip = true

# Release-grade optimization but with debug symbols retained, for profiling.
[profile.profiling]
inherits = "release"
strip = false
debug = true

# Dependencies (the 400+ crate rolldown/oxc graph) are compiled once and then
# cached, but full debug info for them is the bulk of a clean debug build's time
# and disk usage. We almost never step into third-party code, so drop their
# debug info. `line-tables-only` keeps just enough to retain file/line numbers in
# panic backtraces through dependency code while dropping the heavy type/variable
# info that dominates compile time and disk. This glob applies to dependencies
# only, not the workspace crates, so `wesc`/`wesc-node`/`wesc-py`/`wesc-php`/
# `wesc-go`/`wesc-rb` keep full debug info for stepping through.
[profile.dev.package."*"]
debug = "line-tables-only"
